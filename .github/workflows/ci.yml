name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stylua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Load modules headlessly
        run: |
          nvim --headless --clean \
            -c "set runtimepath+=$PWD" \
            -c "lua require('sidekick-zen').setup({}); require('sidekick-zen.health')" \
            -c "lua print('load ok')" -c "qa!"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Run the end-to-end suite
        # A real terminal is required: the PTY sizing these tests protect does
        # not exist under `nvim --headless`.
        run: tests/run.sh
